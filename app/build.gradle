plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def releaseStoreFile = localProps.getProperty('LIGHTSKIP_STORE_FILE') ?: System.getenv('LIGHTSKIP_STORE_FILE')
def releaseStorePass = localProps.getProperty('LIGHTSKIP_STORE_PASSWORD') ?: System.getenv('LIGHTSKIP_STORE_PASSWORD')
def releaseKeyAlias  = localProps.getProperty('LIGHTSKIP_KEY_ALIAS') ?: System.getenv('LIGHTSKIP_KEY_ALIAS')
def releaseKeyPass   = localProps.getProperty('LIGHTSKIP_KEY_PASSWORD') ?: System.getenv('LIGHTSKIP_KEY_PASSWORD')

android {
    namespace 'app.qi.qingtiao'
    compileSdk 35

    defaultConfig {
        applicationId 'app.qi.qingtiao'
        minSdk 26
        targetSdk 35
        versionCode 101
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        if (releaseStoreFile && releaseStorePass && releaseKeyAlias && releaseKeyPass) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}